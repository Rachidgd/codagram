# Renseignez client_id après « shopify app config link ».
name = "Ely'Skin — Rendez-vous"
handle = "elyskin-rendez-vous"
application_url = "https://exemple.invalid"
embedded = true

[access_scopes]
scopes = "read_metaobjects,write_metaobjects,read_metaobject_definitions"

[auth]
redirect_urls = ["https://exemple.invalid/auth/callback"]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks"

# Point d'entrée appelé par la boutique pour lire les créneaux réellement
# libres et poser une réservation. Sans lui, la boutique se rabat sur son
# propre calcul, qui ignore les rendez-vous déjà pris.
[app_proxy]
url = "https://exemple.invalid/proxy"
subpath = "rendez-vous"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
